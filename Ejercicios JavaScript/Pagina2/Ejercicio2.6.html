<html>
    <body>
        <script type = "text/javascript">
        /*6. Crea un programa que permita introducir los datos de nacimiento de varias personas.
        El programa debe:
        ● Crear un array que almacene los nombres de 5 personas.
        ● Crear tres arrays que almacenen, respectivamente, el día, mes y año de nacimiento
        de cada persona.
        ● Crear una función que calcule la edad de cada persona utilizando la fecha actual
        obtenida mediante Date.
        ● Mostrar para cada persona su nombre y su edad actual.
        ● Finalmente, mostrar el nombre de la persona de mayor edad y el de menor edad.
        ● Para calcular la edad correctamente, debes comprobar si la persona ya ha cumplido
        años durante el año actual.*/
        
        let nombres = [];
        let dias = [];
        let meses = [];
        let años = [];
        let edades = [];
        
        for ($i = 0; $i < 5; $i++) {
            nombres[$i] = prompt("Introduce el nombre de la persona " + (i + 1) + ":");
            dias[$i] = parseInt(prompt("Introduce el día de nacimiento de " + $nombres[$i] + ":"));
            meses[$i] = parseInt(prompt("Introduce el mes de nacimiento de " + $nombres[$i] + ":"));
            años[$i] = parseInt(prompt("Introduce el año de nacimiento de " + $nombres[$i] + ":"));
        }

        function calcularEdad(dia, mes, año) {
            const fechaActual = new Date();
            let edad = fechaActual.getFullYear() - año;
            if (fechaActual.getMonth() + 1 < mes || (fechaActual.getMonth() + 1 === mes && fechaActual.getDate() < dia)) {
                edad--;
            }
            return edad;
        }

        for ($i = 0; $i < 5; $i++) {
            $edades[$i] = calcularEdad($dias[$i], $meses[$i], $años[$i]);
            document.write("Nombre: " + $nombres[$i] + ", Edad: " + $edades[$i] + "<br>");
        }

        let mayorEdad = $edades[0];
        let menorEdad = $edades[0];
        let nombreMayor = $nombres[0];
        let nombreMenor = $nombres[0];

        for ($i = 0; $i < 5; $i++) {
            if ($edades[$i] > mayorEdad) {
                mayorEdad = $edades[$i];
                nombreMayor = $nombres[$i];
            }
            if ($edades[$i] < menorEdad) {
                menorEdad = $edades[$i];
                nombreMenor = $nombres[$i];
            }
        }

        document.write("La persona de mayor edad es: " + nombreMayor + " con " + mayorEdad + " años<br>");
        document.write("La persona de menor edad es: " + nombreMenor + " con " + menorEdad + " años<br>"); 
        
        </script>
    </body>
</html>
