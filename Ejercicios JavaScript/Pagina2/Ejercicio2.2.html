<html>
    <body>
        <script type = "text/javascript">
            /*2. Para obtener el número del Tarot de una persona, hay que sumar los números de su
            fecha de nacimiento y reducirlos a un sólo dígito. Realizar un programa que lea una
            fecha de teclado y escriba el número del Tarot en base a la fecha leída. La fecha
            estará formada por tres números enteros, el día, el mes y el año (4 dígitos). No
            utilizar la clase Date.
            Ejemplo:
            Supóngase que una persona nace el día 1 de Julio de 1966. La suma de los tres
            números da como resultado 1 + 7 + 1966 = 1974. El resultado obtenido no está
            formado por un sólo dígito, por lo que habrá que sumar las cuatro cifras que
            componen el número: 1 + 9 + 7 + 4 = 21. Al igual que antes, el resultado no está
            formado por un dígito, por lo que hay que repetir el proceso, 2 + 1 = 3. El resultado obtenido es el número del Tarot 3.*/

            var dia = parseInt(prompt("Ingrese el día de nacimiento (1-31):"));
            var mes = parseInt(prompt("Ingrese el mes de nacimiento (1-12):"));
            var anio = parseInt(prompt("Ingrese el año de nacimiento (4 dígitos):"));

            var suma = dia + mes + anio;

            while(true){
                var sumaString = suma.toString();
                if(sumaString.length === 1){
                    break;
                }
                suma = 0;
                for(var i = 0; i < sumaString.length; i++){
                    suma += parseInt(sumaString[i]);
                }
            }
            document.writeln("El número del Tarot es: " + suma);
        </script>
    </body>
</html>
