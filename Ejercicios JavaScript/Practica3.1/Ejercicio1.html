
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="" id="formulario">
        Nombre:
        <input type="text" id="nombre"><br>

        Correo electrónico:
        <input type="text" id="correo"><br>
        
        Teléfono:
        <input type="text" id="telefono"><br>
        
        
        Asunto:
        <select id="asunto">
            <option value="">Selecciona un asunto</option>
            <option value="consulta">Consulta</option>
            <option value="incidencia">Incidencia</option>
            <option value="reclamacion">Reclamación</option>
            <option value="otro">Otro</option>
        </select><br>
        
        Mensaje:
        <textarea id="mensaje"></textarea><br>
        <input type="checkbox" id="privacidad">
        
        Acepto la política de privacidad<br>
        <input type="submit" value="Enviar">
    </form>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const formulario = document.getElementById("formulario");

    formulario.addEventListener("submit", (evt) => {
        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const asunto = document.getElementById("asunto").value;
        const mensaje = document.getElementById("mensaje").value;
        const privacidad = document.getElementById("privacidad").checked;

        const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const regexTelefono = /^\d{9}$/;

        if (nombre === "") {
            alert("El nombre no puede estar vacío ni contener solo espacios.");
            evt.preventDefault();
            return;
        }

        if (!regexCorreo.test(correo)) {
            alert("El correo electrónico no tiene un formato válido.");
            evt.preventDefault();
            return;
        }

        if (!regexTelefono.test(telefono)) {
            alert("El teléfono debe estar formado por 9 cifras consecutivas.");
            evt.preventDefault();
            return;
        }

        if (asunto === "") {
            alert("Debes seleccionar un asunto.");
            evt.preventDefault();
            return;
        }

        if (mensaje.trim() === "" || mensaje.length < 20) {
            alert("El mensaje debe tener al menos 20 caracteres y no contener solo espacios.");
            evt.preventDefault();
            return;
        }

        if (!privacidad) {
            alert("Debes aceptar la política de privacidad.");
            evt.preventDefault();
            return;
        }
    });
});
</script>
    
</body>
</html>
