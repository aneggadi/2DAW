
<html> 
    <body> 
        <script type = "text/javascript">
            /* 3. Confeccionar un programa que permita cargar el nombre de un usuario y
            su mail por teclado. Mostrar posteriormente los datos en la página HTML.*/
            var nombre;
            var mail;
            nombre = prompt("Introduzca su nombre de usuario");
            mail = prompt("Introduzca su correo");
            document.writeln("Su nombre de usuario es: " + nombre + "<br>");
            document.writeln("Su correo es: "+ mail);
        </script>
    </body>
</html>
