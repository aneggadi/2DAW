<html>

<body>

    <script type="text/javascript">
        /* 14. Se ingresa por teclado un valor entero, mostrar una leyenda que indique
        si el numero es positivo, cero o negativo. */
        
        var numero = parseInt(prompt("Ingresa un numero entero:"));

        if (numero > 0) {
            document.write("El numero es positivo");
        } else if (numero === 0) {
            document.write("El numero es cero");
        } else {
            document.write("El numero es negativo");
        }
    </script>

</body>
</html>
