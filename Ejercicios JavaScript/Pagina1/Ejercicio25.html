<html>
    <body>
        <script type = "text/javascript">
            /*25. Realizar un programa que imprima 25 términos de la serie 11 - 22 - 33 -
            44, etc. (No se ingresan valores por teclado).*/
            var x = 11;
            var i = 1;
            while (i <= 25) {
                document.writeln(x);
                x += 11;
                i++;
            }
        </script>
    </body>
</html>
