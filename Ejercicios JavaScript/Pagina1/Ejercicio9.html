<html>
    <body>
        <script type = "text/javascript">
            /*9. Solicitar que se ingrese dos veces una clave. Mostrar un mensaje si son
            iguales (tener en cuenta que para ver si dos variables tienen el mismo valor
            almacenado debemos utilizar el operador ==)*/
            
            var num1,num2;

            num1 = prompt("Introduce el primer valor");
            num2 = prompt("Introduce el segundo valor");

            if (num1 == num2)
                document.writeln("Los valores son iguales");
            else
                document.writeln("Los valores no son iguales");


        </script>
    </body>
</html>
