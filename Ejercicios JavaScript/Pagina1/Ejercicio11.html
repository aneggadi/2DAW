<html>
    <body>
        <script type = "text/javascript">
            /*11. Se ingresan tres notas de un alumno, si el promedio es mayor o igual a 4
            mostrar un mensaje 'regular', sino 'mal'*/
            
            var nota1 = parseInt(prompt("Ingresa la primera nota:"));
            var nota2 = parseInt(prompt("Ingresa la segunda nota:"));
            var nota3 = parseInt(prompt("Ingresa la tercera nota:"));
            
            var promedio = (nota1 + nota2 + nota3) / 3;
            
            if (promedio >= 4) {
                document.write("regular");
            } else {
                document.write("mal");
            }
            
        </script>
    </body>
</html>
