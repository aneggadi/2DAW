<html>
<body>

    <script type="text/javascript">
        /* 19. Se ingresan por teclado tres numeros, si todos los valores ingresados
        son menores a 10, imprimir en la pagina la leyenda ' Todos los numeros son
        menores a diez'. */
        
        var num1 = parseInt(prompt("Ingresa el primer numero:"));
        var num2 = parseInt(prompt("Ingresa el segundo numero:"));
        var num3 = parseInt(prompt("Ingresa el tercer numero:"));

        if (num1 < 10 && num2 < 10 && num3 < 10) {
            document.write("Todos los numeros son menores a diez");
        }
    </script>

</body>
</html>
