<html>
<body>

    <script type="text/javascript">
        /* 16. De un postulante a un empleo, que realizo un test de capacitacion, se
        obtuvo la siguiente informacion: nombre del postulante, cantidad total de
        preguntas que se le realizaron y cantidad de preguntas que contesto
        correctamente. Se pide confeccionar un programa que lea los datos del
        postulante e informe el nivel del mismo segun el porcentaje de respuestas
        correctas que ha obtenido, y sabiendo que:
        Nivel superior: Porcentaje>=90%.
        Nivel medio: Porcentaje>=75% y <90%.
        Nivel regular: Porcentaje>=50% y <75%.
        Fuera de nivel: Porcentaje<50%. */
        
        var nombre = prompt("Ingresa el nombre del postulante:");
        var totalPreguntas = parseInt(prompt("Ingresa la cantidad total de preguntas:"));
        var correctas = parseInt(prompt("Ingresa la cantidad de respuestas correctas:"));

        var porcentaje = (correctas / totalPreguntas) * 100;

        document.write("Postulante: " + nombre + "<br>");

        if (porcentaje >= 90) {
            document.write("Nivel superior");
        } else if (porcentaje >= 75) {
            document.write("Nivel medio");
        } else if (porcentaje >= 50) {
            document.write("Nivel regular");
        } else {
            document.write("Fuera de nivel");
        }
    </script>

</body>
</html>
