<html>
    <body>
        <script type = "text/javascript">
            /* 7. Se debe desarrollar un programa que pida el ingreso del precio de un
            artículo y la cantidad que lleva el cliente. Mostrar lo que debe abonar el
            comprador (Ingresar por teclado un precio sin decimales, es decir un entero:
            2, 7, 90 etc.)*/

            var PrecioU,Unidades
            PrecioU = prompt("Introduce el primer valor");
            Unidades = prompt("Introduce el segundo valor");
        
            
            var PrecioF = parseInt(PrecioU) * parseInt(Unidades);

            document.writeln("El precio total del cliente es: " + PrecioF + "<br>")

        </script>
    </body>
</html>
