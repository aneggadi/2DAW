<html>
    <body>
        <script type = "text/javascript">
            /*26. Mostrar los múltiplos de 8 hasta el valor 500. Debe aparecer en pantalla
            8 -16 -24, etc.*/
            var x = 8;
            while (x <= 500) {
                document.writeln(x + "<br>");
                x += 8;
            }
        </script>
    </body>
</html>
