<html>
    <body>
        <script type = "text/javascript">
            /*8. Se ingresan tres notas de un alumno, si el promedio es mayor o igual a
            siete mostrar el mensaje 'Promocionado'. Tener en cuenta que para obtener
            el promedio debemos operar suma=nota1+nota2+nota3; y luego hacer
            promedio=suma/3;*/
            var nota1,nota2,nota3;
            var promedio;

            nota1 = prompt("Introduce la primera nota");
            nota2 = prompt("Introduce la segunda nota");
            nota3 = prompt("Introduce la tercera nota");

            promedio = (parseInt(nota1) + parseInt(nota2) + parseInt(nota3)) / 3;

            document.writeln("El promedio de las notas es: " + promedio)

            
        </script>
    </body>
</html>
