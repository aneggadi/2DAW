<html>
    <body>
        <script type = "text/javascript">
            /*5. Escribir un programa en el cual se ingresen cuatro números, calcular e
            informar la suma de los dos primeros y el producto del tercero y el cuarto.*/
            var num1, num2,num3,num4;

            num1 = prompt("Introduce el primer valor");
            num2 = prompt("Introduce el segundo valor");
            num3 = prompt("Introduce el tercer valor");
            num4 = prompt("Introduce el cuarto valor");
            
            var suma = parseInt(num1) + parseInt(num2);
            var producto = parseInt(num3) * parseInt(num4);

            document.writeln("La suma de los dos primeros valores es: " + suma + "<br>")
            document.writeln("El producto de los dos ultimos valores es: " + producto)

        </script>
    </body>
</html>
