<html>
    <body>
        <script type = "text/javascript">
            /*6. Realizar un programa que lea cuatro valores numéricos e informar su
            suma y producto*/

            var num1,num2,num3,num4;

            num1 = prompt("Introduce el primer valor");
            num2 = prompt("Introduce el segundo valor");
            num3 = prompt("Introduce el tercer valor");
            num4 = prompt("Introduce el cuarto valor");
            
            var suma = parseInt(num1) + parseInt(num2) + parseInt(num3) + parseInt(num4);
            var producto = parseInt(num1) * parseInt(num2) * parseInt(num3) * parseInt(num4);

            document.writeln("La suma de los valores es: " + suma + "<br>")
            document.writeln("El producto de los  valores es: " + producto)
        </script>
    </body>
</html>
