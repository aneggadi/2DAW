<html>
<body>

    <script type="text/javascript">
        /* 17. Realizar un programa que pida cargar una fecha cualquiera, luego
        verificar si dicha fecha corresponde a Navidad (se debe cargar por separado
        el dia, el mes y el ano) */
        
        var dia = parseInt(prompt("Ingresa el dia:"));
        var mes = parseInt(prompt("Ingresa el mes:"));
        var anio = parseInt(prompt("Ingresa el ano:"));

        if (dia === 25 && mes === 12) {
            document.write("La fecha corresponde a Navidad");
        } else {
            document.write("La fecha no corresponde a Navidad");
        }
    </script>

</body>
