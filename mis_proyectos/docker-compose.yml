version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: docker.io/library/mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_base_datos
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Añade estas dos líneas para inicializar Sakila automáticamente.
      # El prefijo 01 y 02 garantiza que el esquema se cree antes de insertar los datos.
      - ./sakila-schema.sql:/docker-entrypoint-initdb.d/01-sakila-schema.sql
      - ./sakila-data.sql:/docker-entrypoint-initdb.d/02-sakila-data.sql

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
